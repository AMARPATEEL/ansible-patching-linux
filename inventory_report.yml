---
- name: Work out which Linux servers to report on
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Read the requested IPs and what AWS discovered
      ansible.builtin.set_fact:
        requested_linux: "{{ (linux_ips | default('')).split(',') | map('trim') | select | list }}"
        discovered_linux: "{{ groups.get('tag_OSFamily_ubuntu', []) + groups.get('tag_OSFamily_debian', []) + groups.get('tag_OSFamily_amazonlinux', []) + groups.get('tag_OSFamily_rhel', []) + groups.get('tag_OSFamily_suse', []) }}"

    - name: Stop if nothing was entered
      ansible.builtin.assert:
        that: requested_linux | length > 0
        fail_msg: "linux_ips is empty - enter server IPs, or the word all"

    - name: Pick the servers to report on
      ansible.builtin.set_fact:
        report_hosts: "{{ discovered_linux if 'all' in requested_linux else discovered_linux | intersect(requested_linux) }}"
        missing_ips: "{{ [] if 'all' in requested_linux else requested_linux | difference(discovered_linux) }}"

    - name: Build the host pattern
      ansible.builtin.set_fact:
        report_pattern: "{{ report_hosts | join(':') if report_hosts | length > 0 else 'no_hosts_selected' }}"

- name: Collect facts from the selected servers (read-only)
  hosts: "{{ hostvars['localhost']['report_pattern'] }}"
  gather_facts: no
  tasks:
    - name: Gather facts
      ansible.builtin.setup:
      ignore_unreachable: true

- name: Print the report
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Build the report text
      ansible.builtin.set_fact:
        report_text: |
          {{ '%-17s %-14s %-12s %-28s %-8s %s' | format('IP', 'OS', 'VERSION', 'KERNEL', 'UPTIME', 'NAME') }}
          {{ '-' * 100 }}
          {% for h in report_hosts %}
          {% set f = hostvars[h].ansible_facts | default({}) %}
          {% if f.distribution is defined %}
          {{ '%-17s %-14s %-12s %-28s %-8s %s' | format(h, f.distribution, f.distribution_version | default('n/a'), f.kernel | default('n/a'), ((f.uptime_seconds | default(0) | int / 86400) | round(1) | string) + 'd', (hostvars[h].ec2_tags | default({})).Name | default('-')) }}
          {% else %}
          {{ '%-17s %s' | format(h, 'NO DATA (unreachable or login failed)') }}
          {% endif %}
          {% endfor %}
          {% for ip in missing_ips %}
          {{ '%-17s %s' | format(ip, 'NOT FOUND (not running or missing tags)') }}
          {% endfor %}

    - name: Show the report
      ansible.builtin.debug:
        msg: "{{ report_text }}"
